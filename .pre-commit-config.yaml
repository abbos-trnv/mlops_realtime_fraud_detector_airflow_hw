repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        files: ^dbt/(models|macros|tests)/.*\.sql$
        args: [--config, .sqlfluff]
        additional_dependencies:
          - dbt-core==1.9.8
          - dbt-clickhouse==1.9.5
          - sqlfluff-templater-dbt==3.4.2
