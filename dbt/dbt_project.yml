name: fraud_analytics
version: '1.0.0'
config-version: 2
profile: fraud_analytics
require-dbt-version: [">=1.9.0", "<1.10.0"]
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]
dispatch:
  - macro_namespace: dbt_date
    search_order: ['fraud_analytics', 'dbt_date']
vars:
  "dbt_date:time_zone": UTC
models:
  fraud_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +engine: MergeTree()
      +order_by: tuple()
